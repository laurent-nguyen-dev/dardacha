# Fabrication de l'APK Android de test, à chaque envoi de code sur GitHub.
#
# Sur toute branche, l'APK est conservé dans les artefacts du build (pour
# essayer une branche avant fusion). Sur `main` seulement, il est aussi
# publié sur la page « Releases », sous la version de test « apk-test »,
# remplacée à chaque fabrication (docs/exploitation.md) : une branche de
# travail ne peut donc pas écraser la version proposée au public.
name: APK Android

on:
  push:
  workflow_dispatch:

# Un seul build à la fois par branche : un nouvel envoi annule le build en
# cours de la même branche.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # nécessaire pour publier l'APK dans les Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          # Pas de « cache: gradle » ici : cette option cherche des fichiers
          # Gradle qui n'existent qu'après la génération du projet Android.
          # Le cache Gradle est géré plus bas, par actions/cache.

      - name: Installation des dépendances
        run: npm ci

      # Génère le projet Android natif à partir d'app.json (dossier android/,
      # jamais commité : technique.md §1).
      - name: Génération du projet Android
        run: npx expo prebuild --platform android --no-install

      # Cache Gradle : dépendances Android téléchargées, Gradle lui-même et
      # résultats de transformations. Le projet Android étant généré à partir
      # des dépendances npm et d'app.json, la clé dépend de ces deux fichiers ;
      # s'ils changent, on repart du cache précédent le plus proche
      # (restore-keys) plutôt que de zéro.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Compilation « release » : le code JavaScript est embarqué dans l'APK,
      # qui fonctionne sans ordinateur ni connexion. Signé avec la clé de
      # test fournie par Expo : installable directement, pas publiable.
      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommage
        run: cp android/app/build/outputs/apk/release/app-release.apk dardacha.apk

      - name: Conservation dans les artefacts du build
        uses: actions/upload-artifact@v7
        with:
          name: dardacha-apk
          path: dardacha.apk

      - name: Publication dans la version de test « apk-test »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-test --cleanup-tag --yes || true
          gh release create apk-test dardacha.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Version de test (dernière fabrication)" \
            --notes "APK fabriqué automatiquement depuis la branche principale, commit ${GITHUB_SHA::7}, le $(date -u '+%d/%m/%Y à %H:%M') UTC. Version de test, non publiée sur Google Play."
