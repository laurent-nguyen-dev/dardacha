# Intégration continue : les mêmes contrôles que `npm run …` en local
# (README.md, section « Démarrer »). Une étape en échec bloque la fusion.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Installation (versions exactes du package-lock.json)
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Analyse du code
        run: npm run lint
      - name: Mise en forme
        run: npm run format:check
      - name: Tests
        run: npm test -- --ci
      - name: Audit des dépendances
        run: npm run audit
