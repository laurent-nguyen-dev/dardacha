# Publier une version : fabrique l'APK d'une version numérotée et crée sa
# release GitHub (v1.2.0, etc.), qui reste disponible ensuite, contrairement
# à la version de test « apk-test » remplacée à chaque fusion sur main.
#
# Lancement à la main : onglet Actions → « Publier une version » → Run
# workflow, avec le numéro de version et, pour une version passée, le commit
# à partir duquel la fabriquer (docs/exploitation.md).
name: Publier une version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version (ex. 1.3.0)'
        required: true
      ref:
        description: 'Branche ou commit à publier'
        required: true
        default: main

permissions:
  contents: write # nécessaire pour créer la release et son tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Le workflow vient toujours de main ; le code fabriqué vient de `ref`.
      - name: Récupération des outils de publication (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: outils

      - name: Récupération du code à publier
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: app

      - name: Commit publié
        id: commit
        working-directory: app
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refus si la version existe déjà
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v${{ inputs.version }} existe déjà." && exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Installation des dépendances
        working-directory: app
        run: npm ci

      # Numéro de version et versionCode Android, dans l'espace de
      # fabrication seulement (rien n'est poussé dans le dépôt).
      - name: Numéro de version
        run: |
          cp outils/scripts/version.js app/scripts/version.js
          node app/scripts/version.js "${{ inputs.version }}"

      - name: Génération du projet Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compilation de l'APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Création de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fichier="dardacha-v${{ inputs.version }}.apk"
          cp app/android/app/build/outputs/apk/release/app-release.apk "$fichier"
          gh release create "v${{ inputs.version }}" "$fichier" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "Dardacha v${{ inputs.version }}" \
            --notes "APK de la version ${{ inputs.version }} de Dardacha, fabriqué depuis le commit ${{ steps.commit.outputs.sha }}. Version de test, non publiée sur Google Play. Notes de version : docs/versions.md."
